name: Bug report
description: A command produced a wrong result, crashed or exited with the wrong status.
title: "fix(<area>): <short description>"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
        Remove secrets, webhook URLs and private endpoints from anything you paste.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `fleetwatch version` and the commit SHA.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and input
      description: The exact command line. Attach or link sanitized input files.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and exit status
      render: text
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - Offline fixture or synthetic data
        - Stellar Testnet
        - Stellar Mainnet (read-only)
        - Other / local RPC
    validations:
      required: true
